spring:
  application:
    name: pos-core
  datasource:
    # Tests get their own database from Testcontainers. The password has no default on purpose (CLAUDE.md).
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/pos_saas}
    username: ${CORE_DB_USER:pos_admin}
    password: ${CORE_DB_PASSWORD:}
  flyway:
    # Migrations are plain SQL in src/main/resources/db/migration and are never edited once applied (ADR 0034).
    locations: classpath:db/migration
