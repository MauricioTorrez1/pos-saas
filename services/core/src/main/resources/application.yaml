spring:
  application:
    name: pos-core
  datasource:
    # The application connects as pos_app, a role without BYPASSRLS (ADR 0035). Tests get their own
    # database from Testcontainers. Passwords have no default on purpose (CLAUDE.md).
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/pos_saas}
    username: ${CORE_DB_USER:pos_app}
    password: ${CORE_DB_PASSWORD:}
  flyway:
    # Migrations are plain SQL in src/main/resources/db/migration and are never edited once applied (ADR 0034).
    # They run with their own role, the owner of the tables, never with the application role.
    locations: classpath:db/migration
    url: ${CORE_DB_URL:jdbc:postgresql://localhost:5432/pos_saas}
    user: ${CORE_MIGRATION_DB_USER:pos_admin}
    password: ${CORE_MIGRATION_DB_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm "pos" (ADR 0039). Keys and issuer are fetched lazily on the first token, so the
          # core starts even when Keycloak is down; /actuator/health stays public either way.
          issuer-uri: ${CORE_OIDC_ISSUER_URI:http://localhost:8180/realms/pos}
          jwk-set-uri: ${CORE_OIDC_JWK_SET_URI:${CORE_OIDC_ISSUER_URI:http://localhost:8180/realms/pos}/protocol/openid-connect/certs}
          audiences: pos-core
  modulith:
    events:
      jdbc:
        # The outbox table comes from Flyway (V3), never from Modulith, so it is versioned like the rest.
        schema-initialization:
          enabled: false
management:
  tracing:
    sampling:
      # Every request in development; lower it with a property in production.
      probability: ${CORE_TRACING_SAMPLING:1.0}
  opentelemetry:
    # Reads the standard OTEL_EXPORTER_OTLP_* variables, so the collector address is not hard coded.
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
logging:
  pattern:
    # trace and span ids come from the active span; the tenant from TenantContext. No personal data.
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{tenant_id:-}] "
sentry:
  # An empty DSN turns Sentry off. Personal data is never sent.
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  environment: ${CORE_ENVIRONMENT:local}
facturapi:
  # The key comes only from the environment, never from a file (ADR 0041). Empty means no call is made.
  api-key: ${FACTURAPI_API_KEY:}
