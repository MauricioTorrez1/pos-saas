[project]
name = "pos-analytics"
version = "0.0.0"
description = "Analytics and AI service for the point of sale, with no business rules."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
