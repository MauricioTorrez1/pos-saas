# Application metrics arrive through OTLP. Only the collector's own metrics are scraped.
global:
  scrape_interval: 15s

# These resource attributes become labels that dashboards can filter by.
otlp:
  promote_resource_attributes:
    - service.name
    - deployment.environment.name

# Batches and retries can deliver OTLP samples slightly out of order.
storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
