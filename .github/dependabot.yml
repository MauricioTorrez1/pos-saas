version: 2

# Minor and patch updates arrive together once a week, to keep the noise low.
# Major updates get their own PR, and security updates do not wait for this schedule.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /services/core
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The npm ecosystem also covers pnpm.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /services/analytics
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    # Each profile updates apart, so a breaking collector update cannot hold back a database patch.
    groups:
      observability-minor-and-patch:
        patterns: ["grafana/*", "prom/*", "otel/*", "busybox"]
        update-types: [minor, patch]
      automation-minor-and-patch:
        patterns: ["n8nio/*"]
        update-types: [minor, patch]
      core-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # The stack is decided on PostgreSQL 16. A new major version needs its own ADR.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # A new major version of n8n starts as a prerelease, and its Docker tags do not say so.
      - dependency-name: n8nio/n8n
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /services/analytics
    schedule:
      interval: weekly
    groups:
      analytics-images-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # The stack is decided on Python 3.12, and a new minor version of Python can break packages.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
