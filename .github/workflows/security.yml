name: Security

on:
  pull_request:
  push:
    branches: [main]
  # New vulnerabilities get published without any change in this repository.
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

# A new push makes the previous run of a PR pointless. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A secret deleted by a later commit is still exposed, so every commit counts.
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # --redact keeps the secret out of this public log. HEAD leaves other branches out,
      # so a branch abandoned with a secret does not turn every other PR red.
      - name: Scan every commit of this change
        run: gitleaks git --config .gitleaks.toml --log-opts=HEAD --redact --verbose --no-banner

  dependencies:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OSV_SCANNER_VERSION: 2.7.0
      OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        run: |
          binary="$RUNNER_TEMP/osv-scanner"
          curl --fail --silent --show-error --location --output "$binary" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${binary}" | sha256sum --check --strict
          chmod +x "$binary"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Maven resolves the list of Java dependencies that the scan reads.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core/pom.xml
      - name: Scan dependency files
        run: bash scripts/scan-dependencies.sh
