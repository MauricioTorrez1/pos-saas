name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push makes the previous run of a PR pointless. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: Java
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core/pom.xml
      - name: Compile and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from packageManager in package.json. It must run before setup-node.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      # Ubuntu 24.04 restricts the user namespaces that the sandbox of Electron relies on.
      - name: Allow the Electron sandbox
        run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
      # The startup test of the register opens a real window, so it needs a virtual display.
      - name: Run tests
        run: xvfb-run --auto-servernum pnpm test
      # The panel signs in against a fake identity provider, so no Keycloak is needed. Only Chromium is downloaded.
      # The system packages come from the Ubuntu mirrors through apt, which has hung or failed to resolve its hosts
      # and froze the job for ten minutes. Try them once with a limit; if apt is unreachable, install only the
      # browser (its libraries are already in the runner image). A missing library then fails the e2e step by name.
      - name: Install the browser of the panel tests
        timeout-minutes: 6
        run: |
          timeout 90 pnpm --filter @pos-saas/web exec playwright install --with-deps chromium || {
            echo "apt is unreachable, installing the browser without system packages"
            pnpm --filter @pos-saas/web exec playwright install chromium
          }
      - name: Test the panel sign-in in a browser
        run: pnpm --filter @pos-saas/web test:e2e

  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/analytics/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest

  compose-core:
    name: Compose core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway environment file
        run: bash scripts/create-dev-env.sh
      - name: Start the core profile and check its health
        run: bash scripts/wait-for-profile.sh core

  compose-observability:
    name: Compose observability
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway environment file
        run: bash scripts/create-dev-env.sh
      - name: Start the observability profile and check its health
        run: bash scripts/wait-for-profile.sh observability
      - name: Send test telemetry and find it in Grafana
        run: bash scripts/check-observability.sh

  compose-automation:
    name: Compose automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway environment file
        run: bash scripts/create-dev-env.sh
      - name: Start the automation profile and check its health
        run: bash scripts/wait-for-profile.sh automation
      - name: Reach n8n through its published port
        run: curl --fail --silent --show-error http://127.0.0.1:5678/healthz/readiness

  compose-analytics:
    name: Compose analytics
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway environment file
        run: bash scripts/create-dev-env.sh
      - name: Start the analytics profile and check its health
        run: bash scripts/wait-for-profile.sh analytics
      - name: Reach the API through its published port
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Build the dbt models and run their tests
        run: docker compose run --rm dbt build
