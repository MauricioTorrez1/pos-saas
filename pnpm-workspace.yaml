packages:
  - "apps/*"
  - "packages/*"

# electron-builder pulls electron-winstaller only for Squirrel installers. The register uses NSIS, so its build script is not needed.
allowBuilds:
  electron-winstaller: false

# minimatch 9 and 10 have GHSA-g3hv-75wg-m249 (fixed in 11.0.1). Only electron-builder pulls them, to pack the installer, and they never ship in the register.
overrides:
  minimatch@9: 11.0.1
  minimatch@10: 11.0.1
  # exceljs (only the tests read the spreadsheets back with it, E1-44 and E1-47) pulls uuid 8, which has GHSA-w5hq-g745-h8pq (fixed in 11.1.1). It only
  # calls v4(), which was never affected, but the scan reads the lockfile, so the register uses the patched major.
  uuid@8: 11.1.1
